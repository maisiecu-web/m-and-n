<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title id="sitetitle">M&amp;N Amusement Park</title>
<meta id="sitemeta" name="claude:viewport-fit-sides" content="cover">
<link id="fontlink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;700&family=Zen+Maru+Gothic:wght@500;700&family=Yomogi&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Shippori+Mincho:wght@600&display=swap">
<style id="sitestyle">
/* Layout: a shared 1999 homepage for two friends. Gingham page, a scrolling ticker, beveled windows
   for each post / episode / mixtape, a cassette for every tape, and a back-office "desk" window. */
:root{
  --paper:#F1ECF8; --tile:rgba(160,140,220,.12);
  --sheet:#FFFCFA; --ink:#2E2140; --muted:#6E6283; --rule:#DDD3EC; --hard:#2E2140;
  --ribbon:#C0364A; --on-ribbon:#FFF7F5;
  --mango:#F1BB7B; --lilac:#C6CDF7; --aqua:#9FD1C7; --pink:#E6A0C4; --cobalt:#4A62A8;
  --bar:#4A62A8; --bar2:#B06AB3; --on-bar:#FFFFFF;
  --btn:#E4DCF2; --hi:#FFFFFF; --lo:#B3A6CC;
  --maisie:#E6A0C4; --nanami:#9FD1C7; --on-chip:#2A1D24;
  --tape:#3B2E4F; --tape-label:#FFF6E3; --robin:#9EDBD3; --pearl:#FFFDF8;
  --display:"Special Elite","Courier Prime","Courier New",monospace;
  --body:"Courier Prime","Courier New",Courier,monospace;
  --hand:"Caveat","Comic Sans MS",cursive;
  --jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif; --jp-hand:"Yomogi","Zen Maru Gothic",cursive;
  --sakura:#F7C6D6; --hanko:#D2373C; --chic:"Cormorant Garamond","Didot","Bodoni 72",Georgia,serif; --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif; --pop:#E6A0C4; --sign:#2E2140; --velvet:#4E2D63; --velvet-d:#2F1A3E; --velvet-l:#71498A; --gold:#E9BE62; --satin:#E2364F; --sky1:#DCE7FF; --sky2:#FFF1F6; --hill:#BFE6DC; --hill2:#F7D3E1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B1526; --tile:rgba(255,255,255,.03);
    --sheet:#261E35; --ink:#F2ECFA; --muted:#B7A9CC; --rule:#3D3252; --hard:#09060E;
    --ribbon:#FD8A8C; --on-ribbon:#3A0A10;
    --cobalt:#AFC0F2; --bar:#34477F; --bar2:#7C3F80; --on-bar:#FFFFFF;
    --btn:#352A48; --hi:#4E4166; --lo:#120D1A;
    --tape:#130E1C; --tape-label:#F3E7CF; --pop:#0A0610; --sign:#120D1A; --sky1:#14123A; --sky2:#3B2350; --hill:#24485A; --hill2:#4A2B4F; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --pop:#0A0610; --sign:#120D1A; --sky1:#14123A; --sky2:#3B2350; --hill:#24485A; --hill2:#4A2B4F;
  --paper:#1B1526; --tile:rgba(255,255,255,.03);
  --sheet:#261E35; --ink:#F2ECFA; --muted:#B7A9CC; --rule:#3D3252; --hard:#09060E;
  --ribbon:#FD8A8C; --on-ribbon:#3A0A10;
  --cobalt:#AFC0F2; --bar:#34477F; --bar2:#7C3F80; --on-bar:#FFFFFF;
  --btn:#352A48; --hi:#4E4166; --lo:#120D1A;
  --tape:#130E1C; --tape-label:#F3E7CF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;
  background-color:var(--paper);
  background-image:linear-gradient(90deg,var(--tile) 50%,transparent 50%),linear-gradient(var(--tile) 50%,transparent 50%);
  background-size:28px 28px}
h1,h2,h3,p,ol,ul,figure{margin:0;padding:0}
a{color:var(--cobalt)}
:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.wrap{max-width:56rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:clamp(18px,4vw,40px) 56px;display:flex;flex-direction:column;gap:clamp(18px,3vw,26px)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.mast-text{min-width:0;display:flex;flex-direction:column;gap:6px}
.site-title{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3.4rem);line-height:1.05;text-wrap:balance}
.caret{display:inline-block;width:.46em;height:.82em;margin-left:.14em;vertical-align:-.04em;background:var(--ribbon);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tagline{color:var(--muted)}
.duo{display:flex;gap:8px 12px;align-items:flex-end}
.sticker{font-family:var(--hand);font-size:1.5rem;line-height:1;padding:8px 14px 6px;border:2px solid var(--hard);color:var(--on-chip);box-shadow:3px 3px 0 var(--hard)}
.sticker.m{background:var(--maisie);transform:rotate(-4deg)}
.sticker.n{background:var(--nanami);transform:rotate(3deg)}
.quilt{height:16px;border-block:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--pink) 0 30px,var(--ribbon) 30px 60px,var(--lilac) 60px 90px,var(--aqua) 90px 120px,var(--cobalt) 120px 150px,var(--mango) 150px 180px)}

/* ticker */
.ticker{overflow:hidden;white-space:nowrap;border:2px solid var(--ink);background:var(--sheet);font-size:.9rem;box-shadow:inset 2px 2px 0 var(--lo)}
.ticker-track{display:inline-flex;animation:tick 40s linear infinite}
.ticker:hover .ticker-track{animation-play-state:paused}
.ticker-track span{padding:6px 2rem 3px 0}
@keyframes tick{to{transform:translateX(-50%)}}

/* keys */
.key{font-family:var(--display);font-size:.95rem;line-height:1;padding:.72em 1em .5em;border:2px solid var(--ink);border-radius:0;background:var(--btn);color:var(--ink);box-shadow:inset 2px 2px 0 var(--hi),inset -2px -2px 0 var(--lo),3px 3px 0 var(--hard);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.key:active{transform:translate(3px,3px);box-shadow:inset -2px -2px 0 var(--hi),inset 2px 2px 0 var(--lo)}
.key[aria-pressed="true"]{background:var(--ink);color:var(--sheet);box-shadow:inset 2px 2px 0 rgba(0,0,0,.35)}
.key-primary{background:var(--ribbon);color:var(--on-ribbon);box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),inset -2px -2px 0 rgba(0,0,0,.25),3px 3px 0 var(--hard)}
.key-small{font-size:.8rem;padding:.6em .8em .4em}
.key-quiet{background:var(--sheet);border-style:dashed;box-shadow:none}
.nav{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center}
.nav .spacer{flex:1}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.chip{font-family:var(--body);font-size:.85rem;padding:3px 10px 1px;border:2px solid var(--hard);background:var(--sheet);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"].m{background:var(--maisie);color:var(--on-chip)}
.chip[aria-pressed="true"].n{background:var(--nanami);color:var(--on-chip)}
.chip[aria-pressed="true"].a{background:var(--ink);color:var(--sheet)}

/* windows */
.win{border:2px solid var(--ink);background:var(--sheet);box-shadow:6px 6px 0 var(--hard);min-width:0}
.win-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 8px 4px 10px;background:linear-gradient(90deg,var(--bar),var(--bar2));color:var(--on-bar);font-family:var(--display);font-size:.85rem;border-bottom:2px solid var(--ink)}
.win-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-top:3px}
.win-dots{display:flex;gap:4px;flex:none}
.win-dots i{width:.9rem;height:.9rem;background:var(--btn);border:1.5px solid var(--hard)}
.win-body{display:flex;flex-direction:column;gap:14px;padding:clamp(16px,3.5vw,26px);min-width:0}
.feed{display:flex;flex-direction:column;gap:clamp(20px,3vw,28px)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:.85rem;color:var(--muted)}
.by{font-family:var(--hand);font-size:1.25rem;line-height:1;padding:3px 9px 1px;border:1.5px solid var(--hard);color:var(--on-chip)}
.by.maisie{background:var(--maisie)} .by.nanami{background:var(--nanami)}
.kind{text-transform:uppercase;letter-spacing:.1em;font-size:.75rem}
.draft{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;border:1.5px dashed var(--ribbon);color:var(--ribbon);padding:1px 6px 0}
.entry h2{font-family:var(--display);font-weight:400;font-size:clamp(1.35rem,3.6vw,1.75rem);line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.prose{max-width:65ch;white-space:pre-wrap;overflow-wrap:anywhere}
.prose.clip{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* episode */
.ep{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.ep-no{font-family:var(--display);font-size:1.6rem;line-height:1;padding:12px 10px 8px;background:var(--ink);color:var(--mango);border:2px solid var(--hard);min-width:3.4rem;text-align:center;font-variant-numeric:tabular-nums}
.ep > div{min-width:0;display:flex;flex-direction:column;gap:10px}

/* cassette */
.mix{display:grid;grid-template-columns:minmax(0,15rem) 1fr;gap:20px;align-items:start}
@media (max-width:560px){.mix{grid-template-columns:1fr}}
.cassette{max-width:100%;aspect-ratio:1.58;background:var(--tape);border:2px solid var(--hard);border-radius:8px;padding:9% 7% 0;display:flex;flex-direction:column;align-items:center;position:relative;box-shadow:4px 4px 0 var(--hard)}
.c-label{width:100%;background:var(--tape-label);border-radius:3px;padding:6px 10px 4px;font-family:var(--hand);font-size:1.25rem;line-height:1.05;color:#2A1D24;text-align:center;border-top:7px solid var(--mango);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.c-label.nanami{border-top-color:var(--nanami)} .c-label.maisie{border-top-color:var(--maisie)}
.reels{display:flex;gap:26%;margin-top:9%}
.reel{width:2.1rem;aspect-ratio:1;border-radius:50%;background:var(--tape-label);border:5px dotted var(--tape);outline:2px solid var(--tape-label)}
@media (prefers-reduced-motion:no-preference){.mix:hover .reel{animation:spin 2.4s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.tracks{counter-reset:t;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.95rem}
.tracks li{counter-increment:t;display:grid;grid-template-columns:2.2rem 1fr;border-bottom:1px dotted var(--rule);overflow-wrap:anywhere}
.tracks li::before{content:"A" counter(t);color:var(--muted);font-variant-numeric:tabular-nums}
.mix > div{min-width:0;display:flex;flex-direction:column;gap:12px}

/* empty */
.empty{border:2.5px dashed var(--ink);background:var(--sheet);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{font-family:var(--display);font-weight:400;font-size:1.3rem}
.empty p{color:var(--muted);max-width:42ch}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
input,textarea,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:0;padding:.45em .6em .3em;box-shadow:inset 2px 2px 0 var(--lo);width:100%}
textarea{min-height:8rem;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex-direction:row;align-items:center;gap:6px;border:2px solid var(--ink);padding:5px 10px 3px;background:var(--paper);color:var(--ink);cursor:pointer}
.seg input{width:auto;box-shadow:none}
.seg label:has(input:checked){background:var(--ink);color:var(--sheet)}
.hidden-by-kind{display:none}
.note{font-size:.85rem;color:var(--muted)}
.err{color:var(--ribbon);font-size:.9rem}

/* desk */
.ledger{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:6px 8px 4px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:400;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--muted)}
td.num,th.num{text-align:right}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:12px}
.tile{border:2px solid var(--ink);padding:10px 12px 8px;background:var(--paper);display:flex;flex-direction:column;gap:2px}
.tile b{font-family:var(--display);font-weight:400;font-size:1.8rem;line-height:1}
.tile span{font-size:.8rem;color:var(--muted)}

/* about */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:18px}
.card{border:2px solid var(--ink);padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--paper);min-width:0}
.card h3{font-family:var(--hand);font-size:2rem;font-weight:700;line-height:1}

/* plan */
.lockbox{display:flex;flex-direction:column;gap:12px;max-width:26rem}
.lockrow{display:flex;gap:10px;flex-wrap:wrap}
.lockrow input{flex:1 1 10rem;min-width:0}
.tl{display:flex;flex-direction:column;gap:6px;font-size:.85rem}
.tl-row{display:grid;grid-template-columns:8.5rem 1fr;gap:10px;align-items:center}
.tl-track{position:relative;height:18px;border:2px solid var(--ink);background:var(--paper)}
.tl-bar{position:absolute;top:0;bottom:0;background:var(--lilac);border-right:2px solid var(--ink)}
.tl-today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ribbon)}
.tl-months{display:grid;grid-template-columns:8.5rem 1fr;gap:10px;font-size:.72rem;color:var(--muted)}
.tl-months div:last-child{display:flex;justify-content:space-between}
.next{list-style:none;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.next li{display:grid;grid-template-columns:5.6rem 1fr;gap:8px;border-bottom:1px dotted var(--rule);padding-bottom:4px;overflow-wrap:anywhere}
.next time{color:var(--muted);font-variant-numeric:tabular-nums}
.next .lead{font-weight:700}
.dl{display:flex;flex-wrap:wrap;gap:12px}
.ybar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.85rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;color:var(--muted);font-size:.8rem}
.legend i{display:inline-block;width:.9em;height:.9em;border:1.5px solid var(--hard);vertical-align:-.1em;margin-right:4px}
.month{display:flex;flex-direction:column;gap:6px}
.month h3{font-family:var(--display);font-weight:400;font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.month h3 small{font-family:var(--body);font-size:.75rem;color:var(--muted)}
.ygrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:2px solid var(--ink);border-top:2px solid var(--ink)}
.ygrid > *{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.ygrid > :nth-child(7n){border-right:2px solid var(--ink)}
.ydow{background:var(--bar);color:var(--on-bar);font-size:.72rem;text-align:center;padding:3px 0 1px;font-family:var(--display)}
.yday{min-height:4.6rem;padding:3px 4px 5px;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.yday.out{background:var(--paper)}
.yday.wkend{background:color-mix(in srgb,var(--paper) 55%,var(--sheet))}
.yday.today{outline:3px solid var(--ribbon);outline-offset:-3px}
.yday b{font-size:.75rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ev{font-size:.68rem;line-height:1.2;padding:1px 4px 0;border:1px solid var(--hard);color:var(--on-chip);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.M{background:var(--maisie)} .ev.N{background:var(--nanami)} .ev.B{background:var(--lilac)}
.ev.Launch{background:var(--ribbon);color:var(--on-ribbon);font-weight:700}
.ev.Meeting{background:transparent;color:var(--muted);border-style:dotted}
.ev.later{border-style:dashed}
.ylist{display:none;list-style:none;flex-direction:column}
.ylist li{display:grid;grid-template-columns:4.4rem 1fr;gap:8px;padding:5px 0 4px;border-bottom:1px dotted var(--rule)}
.ylist li.today time{color:var(--ribbon);font-weight:700}
.ylist time{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ylist div{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.ylist .ev{font-size:.78rem;white-space:normal}
@media (max-width:620px){.ygrid{display:none}.ylist{display:flex}}
/* amusement park skin */
.park .win-bar{background:repeating-linear-gradient(90deg,var(--ribbon) 0 22px,var(--bar) 22px 44px)}
.park .win-name{background:var(--ink);color:var(--sheet);padding:3px 8px 0;border:1.5px solid var(--hard)}
.awning{height:30px;margin:calc(-1*clamp(16px,3.5vw,26px)) calc(-1*clamp(16px,3.5vw,26px)) 4px;position:relative;background:repeating-linear-gradient(90deg,var(--ribbon) 0 30px,var(--sheet) 30px 60px);border-bottom:2px solid var(--ink)}
.awning::after,.tent::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:radial-gradient(circle at 15px 0,var(--ribbon) 14px,transparent 15px) 0 0/60px 14px repeat-x,radial-gradient(circle at 45px 0,var(--sheet) 14px,transparent 15px) 0 0/60px 14px repeat-x}
.tent{height:26px;position:relative;margin-bottom:14px;background:repeating-linear-gradient(90deg,var(--ribbon) 0 30px,var(--sheet) 30px 60px);border:2px solid var(--ink);border-bottom-width:0}
.bunting{display:flex;justify-content:space-between;height:18px;margin-top:6px;overflow:hidden}
.bunting i{flex:none;width:20px;height:18px;clip-path:polygon(0 0,100% 0,50% 100%);border-top:2px solid var(--ink)}
.bunting i:nth-child(5n+1){background:var(--pink)}.bunting i:nth-child(5n+2){background:var(--mango)}.bunting i:nth-child(5n+3){background:var(--aqua)}.bunting i:nth-child(5n+4){background:var(--lilac)}.bunting i:nth-child(5n){background:var(--ribbon)}
.park-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.park-head h2{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4vw,2rem);line-height:1.1;flex:1 1 12rem;min-width:0;text-wrap:balance}
.wheel{flex:none;width:86px;height:auto;color:var(--ink)}
.duo .wheel{width:auto}
.wheel .spin{transform-origin:50px 46px}
@media (prefers-reduced-motion:no-preference){.wheel .spin{animation:spin 18s linear infinite}.wheel .cab{animation:spin 18s linear infinite reverse;transform-box:fill-box;transform-origin:50% 0}}
.park .tl-track{height:20px;border-radius:10px;overflow:hidden}
.park .tl-bar{background:repeating-linear-gradient(-45deg,var(--pink) 0 7px,var(--sheet) 7px 14px);border-right:0}
.park .tl-bar.go{background:repeating-linear-gradient(-45deg,var(--ribbon) 0 7px,var(--mango) 7px 14px)}
.month h3,.marquee{background:var(--sign);color:var(--mango);padding:12px 14px 8px;border:2px solid var(--hard);position:relative;box-shadow:4px 4px 0 var(--ribbon)}
.month h3::before,.month h3::after,.marquee::before,.marquee::after{content:"";position:absolute;left:4px;right:4px;height:6px;background:radial-gradient(circle,var(--mango) 2.2px,transparent 2.8px) 0 0/12px 6px repeat-x}
.month h3::before,.marquee::before{top:2px}.month h3::after,.marquee::after{bottom:2px;background-position:6px 0}
@media (prefers-reduced-motion:no-preference){.month h3::before,.month h3::after,.marquee::before,.marquee::after{animation:bulbs 1.4s steps(2) infinite}}
@keyframes bulbs{50%{background-position:6px 0}}
.month h3 small{color:#FFF6E3}
.marquee{display:inline-block;padding:16px 20px 10px}
.marquee .caret{background:var(--mango)}
.park .ev{border-radius:3px;padding:2px 7px 1px;-webkit-mask:radial-gradient(circle 3.5px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 3.5px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 3.5px at 0 50%,transparent 97%,#000) left/51% 100% no-repeat,radial-gradient(circle 3.5px at 100% 50%,transparent 97%,#000) right/51% 100% no-repeat}

@media (prefers-reduced-motion:no-preference){

        memories.rolls.forEach(roll => body.append(...stripFor(roll, fi => viewFrame(roll, fi))));
        if (memories.letters){
          const thread = el('ol',{class:'letters'}); let yr = '';
          memories.letters.forEach(([y, mo, who, title]) => {
            if (y !== yr){ yr = y; thread.append(el('li',{class:'l-year',text:y})); }
            thread.append(el('li',{class:'l-item ' + who}, el('span',{class:'l-env','aria-hidden':'true',text:'✉'}), el('span',{class:'l-title',text:title}), el('span',{class:'l-meta',text:(who==='M'?'Maisie':who==='N'?'Nanami':'M & N') + ' · ' + mo})));
          });
          body.append(el('p',{class:'rollname hl',text:'✉ letters across the years · a few from 89'}), el('div',{class:'letterwrap'}, thread));
        }
        body.append(el('p',{class:'note',style:'text-align:center',text:'tap a roll to hold it up to the light · swipe →'}));
      } else {
        const inp = el('input',{type:'password',autocomplete:'off','aria-label':'Password',placeholder:'password'});
        const err = el('p',{class:'err',hidden:true});
        const btn = el('button',{class:'rw-btn',type:'submit',text:'untie the ribbon ✦'});
        const f = el('form',{class:'mb-lock'}, el('div',{class:'mb-lid','aria-hidden':'true'}), el('p',{text:'Four more rolls are tied up with a ribbon. Members only.'}), el('div',{class:'lockrow'}, inp, btn), err);
        f.addEventListener('submit', async ev => { ev.preventDefault(); btn.disabled = true; btn.textContent = 'untying…';
          try { await tryOpen(inp.value); show(); } catch(e){ err.textContent = 'The ribbon won\'t budge. Check the password.'; err.hidden = false; btn.disabled = false; btn.textContent = 'untie the ribbon ✦'; } });
        body.append(el('p',{class:'note',style:'text-align:center',text:'tap the roll to hold it up to the light'}), f);
      }
    };
    modal(box, 'wide');
    show();
    if (!memories && pass) tryOpen(pass).then(show).catch(() => {});
  }
  document.addEventListener('contextmenu', e => { if (e.target.closest && e.target.closest('.stripwrap,.bigstrip-wrap,.chat-photo')) e.preventDefault(); });
  function viewFrame(roll, fi){
    // show the whole roll as one big film strip, starting at the frame that was tapped
    const strip = el('div',{class:'bigstrip',role:'list','aria-label':roll.name});
    roll.frames.forEach((src, k) => strip.append(el('figure',{class:'bigframe',role:'listitem'}, el('img',{src:imgURL(src),alt:'',decoding:'async',draggable:'false'}), el('figcaption',{text:(k+1) + ' ▸'}))));
    const scroller = el('div',{class:'bigstrip-wrap'}, el('span',{class:'edge top','aria-hidden':'true',text:'M&N 400   ▸ ' + roll.name.toUpperCase() + '   M&N 400   ▸ ' + roll.name.toUpperCase()}), strip, el('span',{class:'edge bot','aria-hidden':'true'}));
    const step = dir => { const f = strip.querySelector('.bigframe'); scroller.scrollBy({left: dir * ((f ? f.offsetWidth : 300) + 14), behavior:'smooth'}); };
    const prev = el('button',{class:'lb-nav prev',type:'button','aria-label':'Scroll left',text:'‹',onclick:() => step(-1)});
    const next = el('button',{class:'lb-nav next',type:'button','aria-label':'Scroll right',text:'›',onclick:() => step(1)});
    const back = el('button',{class:'rw-x',type:'button','aria-label':'Back to the box',text:'✕',onclick:() => openMemories()});
    const lb = el('div',{class:'lightbox strip-mode',role:'dialog','aria-modal':'true','aria-label':roll.name}, back, prev, scroller, next, el('span',{class:'lb-num',text:roll.name + ' · ' + roll.frames.length + ' frames · swipe →'}));
    modal(lb, 'dark');
    requestAnimationFrame(() => { const f = strip.children[fi]; if (f) scroller.scrollLeft = f.offsetLeft - (scroller.clientWidth - f.offsetWidth) / 2; });
    const keys = e => { if (!document.body.contains(lb)){ document.removeEventListener('keydown', keys); return; } if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); };
    document.addEventListener('keydown', keys);
  }


  function openCharm(label, hello, body){
    closeRide();
    const st = CHARM_STORY[label] || [label, hello];
    const x = el('button',{class:'rw-x',type:'button','aria-label':'Close',text:'✕',onclick:closeRide});
    const pic = el('div',{class:'cc-pic'}); pic.innerHTML = `<svg viewBox="0 0 48 48" style="color:#2E2140" aria-hidden="true">${body}</svg>`;
    const card = el('article',{class:'charm-card',role:'dialog','aria-modal':'true','aria-label':st[0]}, x, el('span',{class:'cc-ring','aria-hidden':'true'}), pic,
      el('p',{class:'cc-kicker',text:'charm no. ' + String(CHARMS.findIndex(c => c[0] === label) + 1).padStart(2,'0')}),
      el('h3',{text:st[0]}), el('p',{class:'cc-story',text:st[1]}), el('p',{class:'cc-hello',text:hello}));
    const scrim = el('div',{class:'ride-scrim'}, card);
    scrim.addEventListener('click', ev => { if (ev.target === scrim) closeRide(); });
    document.body.append(scrim); rideOpen = scrim; document.addEventListener('keydown', escRide); x.focus({preventScroll:true});
  }
  CHARMS.forEach(([label, hello, body]) => {
    const b = el('button',{class:'charm',type:'button',title:label,'aria-label':label});
    b.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 48 48" style="color:var(--hard)" aria-hidden="true">${body}</svg>`);
    b.addEventListener('click', () => label === 'little blue box' ? openMemories() : openCharm(label, hello, body));
    $('#charms').append(b);
  });
  // charms hanging all over the velvet curtains
  (function curtainCharms(){
    const drapes = document.querySelectorAll('.drape'); if (!drapes.length) return;
    const JP = ['daruma','hanami dango','paper crane','koinobori','sensu fan','kokeshi','lucky cat','onigiri','red lantern','Ocean the bear','Ferris wheel','little blue box','birthday cake','macaron'];
    const pickOrder = JP.map(n => CHARMS.find(c => c[0] === n)).filter(Boolean);
    drapes.forEach((d, di) => {
      const layer = el('div',{class:'drape-charms'});
      const SPOTS = [[18,8],[52,14],[30,26],[62,36],[14,44],[44,52],[24,64],[58,72],[16,84],[46,90]];
      SPOTS.forEach(([x, y], k) => {
        const c = pickOrder[(k + di * 10) % pickOrder.length];
        const [label, hello, body] = c;
        const bt = el('button',{class:'dc',type:'button',title:label,'aria-label':label});
        bt.style.left = x + '%'; bt.style.top = y + '%';
        bt.style.setProperty('--len', (14 + (k % 3) * 12) + 'px');
        bt.style.animationDelay = (-(k * .7 + di)) + 's';
        bt.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 48 48" style="color:#2E2140" aria-hidden="true">${body}</svg>`);
        bt.addEventListener('click', e => { e.stopPropagation(); label === 'little blue box' ? openMemories() : openCharm(label, hello, body); });
        layer.append(bt);
      });
      for (let k = 0; k < 16; k++){ const sp = el('i',{class:'dc-spark' + (k % 2 ? ' sk' : ''),'aria-hidden':'true',text: k % 2 ? '✿' : k % 3 ? '✦' : '♡'}); sp.style.left = (8 + Math.random() * 60) + '%'; sp.style.top = (4 + Math.random() * 92) + '%'; sp.style.animationDelay = (-Math.random() * 3) + 's'; layer.append(sp); }
      d.append(layer);
    });
  })();
  function renderYear(today){
    const evLabel = e => e[1]==='Podcast' ? e[2].replace('Episode','Ep') : e[1]==='Mixtape' ? e[2].replace('Mixtape ','Tape ') : e[1]==='Writing' ? 'Writing' : e[1]==='Task' ? 'Due '+e[2].split(' ')[0] : e[1]==='Launch' ? 'LAUNCH' : e[2].replace('Weekly sync','Sync').replace('Monthly retro','Retro');
    const planEnd = D(plan.planEnd);
    const byDay = {};
    plan.year.forEach(e => { if (yWho==='all' || e[3]===yWho || e[3]==='B') (byDay[e[0]] = byDay[e[0]] || []).push(e); });
    const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const who = c => c==='M'?'Maisie':c==='N'?'Nanami':'Both';
    const chip = (e, d) => el('span',{class:'ev '+e[3]+' '+e[1]+(d>planEnd?' later':''),title: e[2]+' · '+who(e[3])+(e[4]&&e[4]!=='both'?' ('+e[4]+')':'')+(d>planEnd?' · rhythm continues, confirm in the Q2 plan':''),text:evLabel(e)});
    const filters = el('div',{class:'ybar'}, el('span',{text:'Show:'}),
      [['all','both of us','a'],['M','Maisie','m'],['N','Nanami','n']].map(([k,l,c]) => el('button',{class:'chip '+c,type:'button','aria-pressed':String(yWho===k),text:l,onclick:()=>{ yWho = k; render(); }})),
      el('button',{class:'key key-small',type:'button',text:'Jump to today',onclick:()=>{ const t = document.getElementById('m-'+iso(today).slice(0,7)); if (t) t.scrollIntoView({behavior:'smooth',block:'start'}); }}));
    const legend = el('div',{class:'legend'}, el('span',{},el('i',{style:'background:var(--maisie)'}),'Maisie leads'), el('span',{},el('i',{style:'background:var(--nanami)'}),'Nanami leads'), el('span',{},el('i',{style:'background:var(--lilac)'}),'both of us'), el('span',{},el('i',{style:'border-style:dashed;background:var(--sheet)'}),'after March: same rhythm, still to confirm'));
    const months = [];
    for (let i = 0; i < 12; i++){
      const first = new Date(2026, 10 + i, 1), y = first.getFullYear(), m = first.getMonth();
      const days = new Date(y, m+1, 0).getDate(), lead = (first.getDay()+6)%7;
      const grid = el('div',{class:'ygrid'}, ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>el('div',{class:'ydow',text:d})));
      for (let k = 0; k < lead; k++) grid.append(el('div',{class:'yday out','aria-hidden':'true'}));
      const list = el('ol',{class:'ylist'});
      let n = 0;
      for (let dd = 1; dd <= days; dd++){
        const d = new Date(y, m, dd), key = iso(d), evs = byDay[key] || [], dow = (d.getDay()+6)%7;
        const isToday = d.getTime()===today.getTime();
        grid.append(el('div',{class:'yday'+(dow>4?' wkend':'')+(isToday?' today':'')}, el('b',{text:String(dd)}), evs.map(e=>chip(e,d))));
        if (evs.length){ n += evs.filter(e=>e[1]!=='Meeting').length; list.append(el('li',{class:isToday?'today':''}, el('time',{text:d.toLocaleDateString(undefined,{weekday:'short',day:'numeric'})}), el('div',{}, evs.map(e=>{ const c = chip(e,d); c.textContent = e[1]==='Meeting'||e[1]==='Task' ? e[2] : evLabel(e)+' · '+who(e[3]); return c; })))); }
      }
      const tail = (7 - (lead + days) % 7) % 7;
      for (let k = 0; k < tail; k++) grid.append(el('div',{class:'yday out','aria-hidden':'true'}));
      months.push(el('section',{class:'month',id:'m-'+iso(first).slice(0,7)},
        el('h3',{}, first.toLocaleDateString(undefined,{month:'long',year:'numeric'}), el('small',{text:n+(n===1?' ride':' rides')})), grid, list));
    }
    return win('funfair_year.cal', el('p',{class:'note',text:'Every day from November 2026 to October 2027. Each ticket is a ride: hover one for the full title. The balloon marks today.'}), filters, legend, months);
  }

  function render(){
    document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view===state.view)));
    document.querySelectorAll('[data-who]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.who===state.who)));
    $('#whoBar').hidden = state.locked || ['about','desk','plan','press','mn'].includes(state.view);
    $('#newBtn').hidden = $('#deskBtn').hidden = state.locked;
    const main = $('#main'); main.replaceChildren();
    if (state.view === 'mn'){
      const page = el('div',{class:'storybook'});
      page.insertAdjacentHTML('afterbegin','<svg class="sb-ribbon" viewBox="0 0 220 60" aria-hidden="true"><path d="M8 18 h204 l-12 12 l12 12 h-204 l12 -12 z" fill="#F7C6D6" stroke="#2E2140" stroke-width="2.5" stroke-linejoin="round"/><text x="110" y="36" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="600" font-size="20" fill="#2E2140">notre histoire</text></svg>');
      page.append(el('h2',{class:'sb-title'}, el('span',{class:'sb-m',text:'M'}), el('span',{class:'sb-amp',text:'&'}), el('span',{class:'sb-n',text:'N'})),
        el('p',{class:'sb-sub',lang:'ja',text:'ふたりの物語 ✦ our little story'}), originCard(),
        el('div',{class:'sb-end'}, el('span',{'aria-hidden':'true',text:'♡ fin ♡'}), el('button',{class:'key key-primary',type:'button',text:'open Pandora\'s box of memories ✦',onclick:() => openMemories()})));
      const w = win('our_story.txt', page); w.classList.add('sb-win'); main.append(w);
    }
    else if (state.locked) main.append(renderGate());
    else if (state.view === 'plan') main.append(...renderPlan());
    else if (state.view === 'press') main.append(renderPress());
    else if (state.view === 'about') main.append(renderAbout());
    else if (state.view === 'desk') main.append(renderDesk());
    else {
      const list = visible().filter(e => state.view==='all' || e.kind===state.view);
      if (!list.length) main.append(emptyState(state.view));
      else list.forEach(e => main.append(renderEntry(e)));
    }
    const live = state.entries.filter(e=>e.status!=='draft');
    $('#countBadge').textContent = state.locked ? 'backstage: members only' : live.length + (live.length===1?' thing':' things') + ' so far';
    const msgs = live.length && !state.locked ? live.slice(0,6).map(e => '★ new '+KIND[e.kind].toLowerCase()+' from '+NAME[e.by]+': '+e.title)
      : ['★ bienvenue au parc', '★ xin chào', '★ ようこそ', '★ いらっしゃいませ', '★ welcome to M&N Amusement Park', '★ same continent, finally!', '★ dear Nanami… dear Maisie…', '★ grand opening Christmas Day 🎄', '★ joyeux Noël · メリークリスマス · Giáng sinh vui vẻ', '★ writing, podcast and mixtape rides coming soon', '★ keep your arms and legs inside the blog'];
    const track = $('#ticker'); track.replaceChildren();
    [...msgs, ...msgs].forEach(m => track.append(el('span',{text:m})));
  }

  // editor
  function syncKind(){
    const k = document.querySelector('input[name=kind]:checked').value;
    document.querySelectorAll('[data-for]').forEach(n => n.classList.toggle('hidden-by-kind', !n.dataset.for.split(' ').includes(k)));
    $('#bodyLabel').textContent = k==='writing' ? 'Your piece' : k==='podcast' ? 'Show notes' : 'Liner notes (the mood, the story behind it)';
    $('#f-body').required = k === 'writing';
  }
  function openEditor(e){
    state.editing = e || null;
    $('#form').reset();
    $('#formErr').hidden = true;
    if (e){
      $('#k-'+e.kind).checked = true; $('#b-'+e.by).checked = true;
      $('#f-title').value = e.title||''; $('#f-ep').value = e.ep ?? ''; $('#f-link').value = e.link||'';
      $('#f-body').value = e.body||''; $('#f-tracks').value = e.tracks||'';
      $('#edName').textContent = 'editing: '+slug(e.title);
    } else $('#edName').textContent = 'new_entry.txt';
    syncKind();
    $('#editor').hidden = false;
    $('#editor').scrollIntoView({behavior:'smooth',block:'start'});
    $('#f-title').focus({preventScroll:true});
  }
  document.querySelectorAll('input[name=kind]').forEach(r => r.addEventListener('change', syncKind));
  $('#cancelBtn').addEventListener('click', () => { $('#editor').hidden = true; state.editing = null; });
  $('#newBtn').addEventListener('click', () => openEditor(null));
  $('#form').addEventListener('submit', async ev => {
    ev.preventDefault();
    if (!artifact || !state.canWrite){ $('#formErr').textContent = 'The password opens the gate, but publishing also needs edit access to this page. Ask Maisie to share it with you from the Share menu (Can edit).'; $('#formErr').hidden = false; return; }
    const status = (ev.submitter && ev.submitter.dataset.status) || 'published';
    const kind = document.querySelector('input[name=kind]:checked').value;
    const link = $('#f-link').value.trim();
    if (link && !safeUrl(link)){ $('#formErr').textContent = 'That link needs to start with https://'; $('#formErr').hidden = false; return; }
    const ep = $('#f-ep').value.trim();
    const data = {
      kind, by: document.querySelector('input[name=by]:checked').value,
      title: $('#f-title').value.trim().slice(0,140), body: $('#f-body').value.slice(0,40000),
      link: kind==='writing' ? '' : link, tracks: kind==='mixtape' ? $('#f-tracks').value.slice(0,4000) : '',
      ep: kind==='podcast' && ep !== '' ? Number(ep) : null, status
    };
    const entries = state.editing
      ? state.entries.map(x => x.id === state.editing.id ? { ...x, ...data } : x)
      : [{ id: uid(), createdAt: Date.now(), ...data }, ...state.entries];
    const ok = await save({ ...snapshot(), entries }, status==='draft' ? 'Saved to drafts' : 'Published');
    if (!ok){ $('#formErr').textContent = 'That didn\'t save. Copy your text somewhere safe, then try again.'; $('#formErr').hidden = false; }
  });

  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; render(); }));
  document.querySelectorAll('[data-who]').forEach(b => b.addEventListener('click', () => { state.who = b.dataset.who; render(); }));

  document.addEventListener('visibilitychange', () => document.documentElement.classList.toggle('paused', document.hidden));
  if (window.matchMedia && (matchMedia('(pointer: coarse)').matches || matchMedia('(max-width: 760px)').matches)) document.documentElement.classList.add('lite');
  document.documentElement.classList.add('site-locked');
  render();
  (async () => { let pw = null; try { pw = sessionStorage.getItem('mn-pass'); } catch(e){} if (pw){ try { await unlockAll(pw); } catch(e){ try { sessionStorage.removeItem('mn-pass'); } catch(_){} } } })();

  (async () => {
    if (!window.claude || !window.claude.use) return;
    const [a, u, dl] = await Promise.all([claude.use('artifact'), claude.use('user'), claude.use('downloads')]);
    artifact = a; downloads = dl;
    let can = false;
    if (a && u){ try { can = (await u.canEdit()) === true; } catch(e){} }
    if (can){ state.canWrite = true; render(); }
  })();
})();
</script>
